name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit + integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify

  load-test:
    name: Docker Compose + flash-sale load test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            curl -sf localhost:8080/actuator/health && exit 0
            sleep 2
          done
          exit 1
      - name: 5,000 users race for 500 tickets
        run: python3 scripts/load_test.py --tickets 500 --users 5000 --concurrency 100
      - name: 3,000 users, enough tickets for everyone (every order must reach MySQL)
        run: python3 scripts/load_test.py --tickets 3000 --users 3000 --concurrency 100
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
