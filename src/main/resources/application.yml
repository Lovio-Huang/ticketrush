spring:
  application:
    name: ticketrush
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ticketrush}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&connectionTimeZone=UTC
    username: ${MYSQL_USER:ticketrush}
    password: ${MYSQL_PASSWORD:ticketrush}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
    consumer:
      group-id: order-writer
      auto-offset-reset: earliest
    listener:
      concurrency: 3
  cache:
    type: caffeine
    cache-names: events
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=10m,recordStats

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

ticketrush:
  orders:
    topic: ticket-orders
    partitions: 3
    payment-window: PT10M
    expiry-scan-interval: PT15S
    expiry-batch-size: 200
  reservations:
    idempotency-ttl: PT24H
    publish-timeout: PT5S
  rate-limit:
    capacity: 10
    refill-per-second: 5
  security:
    # Dev-only default (see SecurityConfig.DEV_SECRET); set JWT_SECRET in any real deployment.
    jwt-secret: ${JWT_SECRET:46nTHWwbEfvhyRNt4EVzb0fs8bOHvuq7D2Wao7h9qn0=}
    token-ttl: PT1H
    admin-username: ${ADMIN_USERNAME:}
    admin-password: ${ADMIN_PASSWORD:}
    login-attempts-per-minute: 5
    auth-requests-per-minute-per-address: 30
  reconciliation:
    interval: PT30S

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
