spring:
  application:
    name: ticketrush
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ticketrush}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&connectionTimeZone=UTC
    username: ${MYSQL_USER:ticketrush}
    password: ${MYSQL_PASSWORD:ticketrush}
    hikari:
      maximum-pool-size: 20
      data-source-properties:
        # Lets the driver send a JDBC batch of INSERTs as one multi-row statement.
        rewriteBatchedStatements: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          # The consumer writes a poll's orders in one transaction: one multi-row INSERT.
          batch_size: 100
        order_inserts: true
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
        # Fail fast (and know the order was never sent) when the brokers can't be reached at all.
        max.block.ms: 1000
        # Bound how long a send can still land after it started: the Redis recovery
        # quiet period (ticketrush.reservations.recovery-quiet-period) relies on it.
        request.timeout.ms: 4000
        delivery.timeout.ms: 10000
    consumer:
      group-id: order-writer
      auto-offset-reset: earliest
      # One batch is one MySQL transaction holding the event's stock row: keep it short
      # (~0.1 s), far inside max.poll.interval.ms (5 min) even when it is redone one by one.
      max-poll-records: 200
    listener:
      concurrency: 3
  cache:
    type: caffeine
    cache-names: events
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=10m,recordStats

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

ticketrush:
  orders:
    topic: ticket-orders
    partitions: 3
    payment-window: PT10M
    expiry-scan-interval: PT15S
    expiry-batch-size: 200
  reservations:
    idempotency-ttl: PT24H
    publish-timeout: PT5S
    republish-after: PT10S
    max-unconfirmed-age: PT30S
    relay-interval: PT2S
    recovery-quiet-period: PT12S
  rate-limit:
    capacity: 10
    refill-per-second: 5
  security:
    # Dev-only default (see SecurityConfig.DEV_SECRET); set JWT_SECRET in any real deployment.
    jwt-secret: ${JWT_SECRET:46nTHWwbEfvhyRNt4EVzb0fs8bOHvuq7D2Wao7h9qn0=}
    token-ttl: PT1H
    admin-username: ${ADMIN_USERNAME:}
    admin-password: ${ADMIN_PASSWORD:}
    login-attempts-per-minute: 5
    auth-requests-per-minute-per-address: 30
  reconciliation:
    interval: PT30S

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
